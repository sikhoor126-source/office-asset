<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Asset · ระบบบริหารครุภัณฑ์สำนักงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --ink:#0e2b27; --ink2:#37544f; --mute:#7d968f;
  --bg:#f0f4f3; --card:#ffffff; --line:#dfe8e5; --line2:#eef3f1;
  --teal:#0fa68e; --teal-d:#0b7a69; --teal-t:#e3f5f1;
  --pine:#0c3b36; --amber:#c07a10; --amber-t:#fdf3e0;
  --red:#c2402f; --red-t:#fceae7;
  --blue:#1a6fa8; --blue-t:#e7f1f8;
  --violet:#6b4fbb; --violet-t:#efeafa;
  --gray-t:#ecf0ef;
  --r:14px; --shadow:0 1px 2px rgba(14,43,39,.06),0 6px 18px rgba(14,43,39,.07);
  font-size:15px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Prompt","Sukhumvit Set","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
button{font-family:inherit;font-size:.9rem;cursor:pointer;border:none;border-radius:10px;padding:.5rem 1rem;transition:filter .12s,transform .08s}
button:hover{filter:brightness(1.05)}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.btn-p{background:linear-gradient(135deg,var(--teal) 0%,var(--teal-d) 100%);color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(15,166,142,.3)}
.btn-s{background:#fff;color:var(--teal-d);border:1.5px solid var(--line);font-weight:600}
.btn-danger{background:var(--red-t);color:var(--red);font-weight:600}
.btn-sm{padding:.32rem .75rem;font-size:.82rem;border-radius:8px}
input,select,textarea{font-family:inherit;font-size:.9rem;width:100%;padding:.52rem .7rem;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);transition:border-color .12s}
input:focus,select:focus,textarea:focus{border-color:var(--teal)}
textarea{resize:vertical;min-height:60px}
label{font-size:.78rem;font-weight:700;color:var(--ink2);display:block;margin-bottom:.28rem}
label .req{color:var(--red)}
.field{margin-bottom:.85rem}
h1{font-size:1.3rem;font-weight:800}h2{font-size:1.06rem;font-weight:800}h3{font-size:.97rem;font-weight:700}
.mute{color:var(--mute);font-size:.84rem}

.badge{display:inline-flex;align-items:center;gap:.25rem;padding:.14rem .62rem;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap}
.b-teal{background:var(--teal-t);color:var(--teal-d)}
.b-amber{background:var(--amber-t);color:var(--amber)}
.b-red{background:var(--red-t);color:var(--red)}
.b-blue{background:var(--blue-t);color:var(--blue)}
.b-violet{background:var(--violet-t);color:var(--violet)}
.b-gray{background:var(--gray-t);color:var(--ink2)}

/* ============ LOGIN ============ */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;background:radial-gradient(1100px 600px at 15% -10%,#14655a 0%,transparent 55%),radial-gradient(900px 700px at 110% 110%,#0f5d52 0%,transparent 50%),linear-gradient(150deg,#092e2a,#0c3b36 60%,#0e463f)}
.login-card{background:rgba(255,255,255,.98);border-radius:22px;padding:2.4rem 2.2rem;width:100%;max-width:410px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.login-card .logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin-bottom:1.1rem;box-shadow:0 6px 16px rgba(15,166,142,.4)}
.login-card .sub{color:var(--mute);font-size:.87rem;margin:.15rem 0 1.5rem}
.login-err{background:var(--red-t);color:var(--red);padding:.55rem .85rem;border-radius:10px;font-size:.85rem;margin-bottom:.9rem;display:none}

/* ============ SHELL ============ */
#appView{display:none}
.shell{display:flex;min-height:100vh}
aside.side{width:264px;flex-shrink:0;background:linear-gradient(180deg,var(--pine) 0%,#0a332e 100%);color:#dcefe9;padding:1.1rem .95rem 1.2rem;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
aside.side::-webkit-scrollbar{width:6px}
aside.side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
.side .brand{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1rem;color:#fff;margin-bottom:1.2rem}
.side .brand .mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--teal),#0c8a76);display:flex;align-items:center;justify-content:center;font-size:1.1rem;box-shadow:0 0 0 3px rgba(15,166,142,.25)}
.side .who{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:.6rem .75rem;font-size:.82rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.side .who b{color:#fff}
.side .who button{background:rgba(255,255,255,.12);color:#fff;padding:.25rem .6rem;font-size:.75rem}
.side nav{display:flex;flex-direction:column;gap:.15rem;margin-bottom:1.1rem}
.side nav button{background:none;color:#c4ddd6;text-align:left;padding:.55rem .75rem;border-radius:10px;font-weight:600;display:flex;align-items:center;gap:.55rem;font-size:.9rem}
.side nav button.on{background:rgba(15,166,142,.22);color:#fff;box-shadow:inset 0 0 0 1px rgba(15,166,142,.35)}
.side nav button .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:.7rem;padding:.02rem .45rem;border-radius:999px}
.side .fhead{font-size:.72rem;letter-spacing:.1em;font-weight:800;color:#8fb5ac;text-transform:uppercase;margin:1rem 0 .5rem;display:flex;justify-content:space-between;align-items:center}
.side .fhead button{background:none;color:#8fb5ac;font-size:.72rem;padding:0;text-decoration:underline}
.side .filt{margin-bottom:.7rem}
.side .filt label{color:#a8c9c1;font-size:.73rem}
.side .filt input,.side .filt select{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff;font-size:.85rem}
.side .filt select option{color:var(--ink)}
.side .filt input::placeholder{color:#7fa39b}
.chiprow{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#cfe7e0;border-radius:999px;padding:.22rem .7rem;font-size:.76rem;font-weight:600}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.sidefoot{margin-top:auto;padding-top:.9rem;border-top:1px solid rgba(255,255,255,.12);display:flex;gap:.65rem;align-items:center}
.sidefoot .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#f7ca5f,#df8f06);color:#3a2a00;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:1.05rem;box-shadow:0 0 0 2.5px rgba(247,202,95,.35);flex-shrink:0}
.sidefoot .nm{color:#fff;font-weight:700;font-size:.83rem;line-height:1.25}
.sidefoot .role{display:inline-flex;align-items:center;gap:.28rem;background:rgba(247,202,95,.14);color:#f7ca5f;border:1px solid rgba(247,202,95,.45);border-radius:999px;padding:.06rem .55rem;font-size:.67rem;font-weight:800;margin-top:.2rem;letter-spacing:.03em}

.content{flex:1;min-width:0;padding:1.2rem 1.4rem 4rem;max-width:1240px}
.pagebar{display:flex;align-items:center;gap:.7rem;margin-bottom:1rem;flex-wrap:wrap}
.pagebar h1{flex:1;min-width:200px}
.bell{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:12px;width:42px;height:42px;font-size:1.15rem;display:flex;align-items:center;justify-content:center}
.bell .dot{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:.68rem;font-weight:800;min-width:19px;height:19px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 .25rem;box-shadow:0 0 0 2px #fff}
#menuBtn{display:none;background:#fff;border:1.5px solid var(--line);width:42px;height:42px;border-radius:12px;font-size:1.1rem}

.ndrawer{position:fixed;top:0;right:-380px;width:360px;max-width:92vw;height:100vh;background:#fff;box-shadow:-10px 0 40px rgba(0,0,0,.18);z-index:80;transition:right .22s;padding:1.1rem;overflow-y:auto}
.ndrawer.open{right:0}
.ndrawer h2{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}
.nitem{border:1.5px solid var(--line);border-left-width:5px;border-radius:12px;padding:.65rem .8rem;margin-bottom:.55rem;cursor:pointer;font-size:.85rem}
.nitem:hover{background:#f7fbfa}
.nitem.warn{border-left-color:var(--amber)}
.nitem.crit{border-left-color:var(--red)}
.nitem.info{border-left-color:var(--blue)}
.nitem b{display:block}

/* ============ CARDS / STATS ============ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem;margin-bottom:1.1rem}
.stat{background:var(--card);border-radius:var(--r);padding:.9rem 1.05rem;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--teal)}
.stat.warn::before{background:var(--amber)}
.stat.bad::before{background:var(--red)}
.stat.info::before{background:var(--blue)}
.stat.money::before{background:var(--violet)}
.stat .n{font-size:1.55rem;font-weight:800;line-height:1.15}
.stat .l{font-size:.78rem;color:var(--mute);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.85rem}
.eq-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;position:relative}
.eq-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(14,43,39,.13)}
.eq-card .ph{height:130px;background:linear-gradient(135deg,#e8f1ef,#f4f8f7);display:flex;align-items:center;justify-content:center;font-size:2.2rem;color:#b9cfc9;position:relative}
.eq-card .ph img{width:100%;height:100%;object-fit:cover}
.eq-card .ph .st{position:absolute;top:.55rem;right:.55rem}
.eq-card .bd{padding:.75rem .95rem .85rem}
.eq-card .code{font-size:.73rem;color:var(--mute);font-weight:800;letter-spacing:.04em}
.eq-card h3{margin:.05rem 0 .25rem}
.eq-card .meta{font-size:.8rem;color:var(--ink2)}
.eq-card .foot{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.55rem}
.eq-card .pick{position:absolute;top:.5rem;left:.5rem;width:22px;height:22px;z-index:2;accent-color:var(--teal)}

/* ============ DETAIL ============ */
.back{background:none;color:var(--teal-d);font-weight:800;padding-left:0;font-size:.9rem}
.det-head{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:1.15rem;display:flex;gap:1.3rem;flex-wrap:wrap;align-items:flex-start;margin-bottom:1rem}
.det-head .photo{width:190px;height:190px;border-radius:14px;background:linear-gradient(135deg,#e8f1ef,#f4f8f7);display:flex;align-items:center;justify-content:center;font-size:3rem;color:#b9cfc9;overflow:hidden;flex-shrink:0}
.det-head .photo img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.det-head .info{flex:1;min-width:250px}
.det-head .qrbox{text-align:center}
.det-head .qrbox .qr{background:#fff;padding:8px;border:1.5px solid var(--line);border-radius:12px;display:inline-block}
.actrow{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.55rem}
.subtabs{display:flex;gap:.35rem;margin-bottom:.85rem;flex-wrap:wrap}
.subtabs button{background:#fff;border:1.5px solid var(--line);color:var(--ink2);border-radius:999px;font-weight:700;padding:.42rem 1rem;font-size:.86rem}
.subtabs button.on{background:linear-gradient(135deg,var(--teal),var(--teal-d));border-color:transparent;color:#fff}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:1.05rem 1.15rem;margin-bottom:1rem}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:.6rem 1rem}
.kv .k{font-size:.73rem;color:var(--mute);font-weight:800}
.kv .v{font-size:.92rem}
.costrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;margin-bottom:.4rem}
.costbox{border:1.5px solid var(--line);border-radius:12px;padding:.65rem .85rem}
.costbox .cl{font-size:.74rem;color:var(--mute);font-weight:800}
.costbox .cv{font-size:1.25rem;font-weight:800}
.costbox.hl{background:linear-gradient(135deg,var(--teal-t),#fff);border-color:var(--teal)}

.tblwrap{overflow-x:auto;border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:.5rem .6rem;text-align:left;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:.72rem;color:var(--mute);font-weight:800;background:#f5faf8;white-space:nowrap;position:sticky;top:0}
tr:hover td{background:#f8fbfa}
td img.thumb{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.imgal{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem;align-items:flex-start}
.imgthumb{position:relative;width:74px;height:74px}
.imgthumb img{width:100%;height:100%;object-fit:cover;border-radius:9px;border:1.5px solid var(--line);cursor:zoom-in}
.imgthumb .rm{position:absolute;top:-7px;right:-7px;width:22px;height:22px;padding:0;border-radius:50%;background:var(--red);color:#fff;font-size:.72rem;font-weight:800;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.3)}

/* ============ MODAL ============ */
.overlay{position:fixed;inset:0;background:rgba(8,35,31,.5);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:90;padding:2rem .8rem;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:18px;width:100%;max-width:780px;padding:1.35rem 1.5rem;box-shadow:0 25px 70px rgba(0,0,0,.35)}
.modal h2{margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center}
.modal h2 .x{background:var(--gray-t);font-size:1rem;color:var(--ink2);padding:.2rem .55rem;border-radius:8px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(218px,1fr));gap:0 .95rem}
.fgrid .wide{grid-column:1/-1}
.factions{display:flex;justify-content:space-between;gap:.6rem;margin-top:.5rem;border-top:1.5px solid var(--line2);padding-top:1rem;align-items:center;flex-wrap:wrap}
.recbox{background:var(--teal-t);border:1.5px solid var(--teal);border-radius:12px;padding:.6rem .8rem;flex:1;min-width:230px}
.recbox label{color:var(--teal-d)}

#qrReader{width:100%;max-width:340px;margin:0 auto;border-radius:14px;overflow:hidden;background:#000;min-height:230px}
#qrReader video{width:100%!important;border-radius:14px}
.scanmode{display:flex;gap:.4rem;margin-bottom:.7rem;flex-wrap:wrap}
.scanmode button{flex:1;min-width:130px;background:#fff;border:1.5px solid var(--line);color:var(--ink2);font-weight:700;border-radius:10px;padding:.5rem}
.scanmode button.on{background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff;border-color:transparent}
.scanhit{display:flex;align-items:center;gap:.6rem;border:1.5px solid var(--line);border-left-width:5px;border-left-color:var(--teal);border-radius:11px;padding:.5rem .7rem;margin-bottom:.45rem}
.scanhit img{width:42px;height:42px;object-fit:cover;border-radius:8px;flex-shrink:0}
.scanhit .t{flex:1;min-width:0;font-size:.86rem;line-height:1.3}
.scanhit .t b{display:block}

/* ============ QR PRINT ============ */
.qrprev{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem;max-height:420px;overflow-y:auto;padding:.3rem;background:var(--line2);border-radius:12px}
.qrprev .lbl{background:#fff;border-radius:8px;padding:.4rem;text-align:center;font-size:.68rem;line-height:1.3;border:1px solid var(--line)}
.qrprev .lbl canvas,.qrprev .lbl img{width:100%;height:auto;border-radius:4px}
.progwrap{background:var(--line2);border-radius:999px;height:12px;overflow:hidden;margin:.5rem 0}
.progbar{background:linear-gradient(90deg,var(--teal),var(--teal-d));height:100%;width:0;transition:width .2s}

#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out;gap:.5rem}
#lightbox img{max-width:82vw;max-height:86vh;border-radius:10px;cursor:default}
.lbnav{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:2rem;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;backdrop-filter:blur(3px)}
.lbnav:hover{background:rgba(255,255,255,.3)}
.lbcount{position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;padding:.32rem 1.1rem;border-radius:999px;font-size:.9rem;font-weight:700}
.lbclose{position:absolute;top:1rem;right:1rem;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:1.1rem;padding:0}
.thumbwrap{position:relative;display:inline-block;cursor:zoom-in}
.thumbwrap .cnt{position:absolute;right:-4px;bottom:-4px;background:var(--teal-d);color:#fff;font-size:.66rem;font-weight:800;padding:.06rem .38rem;border-radius:999px;box-shadow:0 0 0 2px #fff}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--pine);color:#fff;padding:.65rem 1.3rem;border-radius:999px;font-size:.88rem;opacity:0;transition:opacity .25s;z-index:100;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1}
.empty{padding:2.2rem;text-align:center;color:var(--mute)}

#pdfReport{position:fixed;left:-9999px;top:0;width:794px;background:#fff;color:#111;padding:34px 40px;font-size:13px;line-height:1.5}
#pdfReport h1{font-size:19px;margin-bottom:2px}
#pdfReport h2{font-size:14px;margin:14px 0 6px;border-bottom:2px solid #0b7a69;padding-bottom:3px;color:#0b7a69}
#pdfReport table{width:100%;border-collapse:collapse;font-size:11px}
#pdfReport th,#pdfReport td{border:1px solid #ccc;padding:3px 5px;text-align:left}
#pdfReport th{background:#e3f5f1}
#qrFactory{position:fixed;left:-9999px;top:0}

@media(max-width:900px){
  aside.side{position:fixed;left:-280px;z-index:85;transition:left .22s;box-shadow:10px 0 40px rgba(0,0,0,.25)}
  aside.side.open{left:0}
  #menuBtn{display:flex;align-items:center;justify-content:center}
  .content{padding:1rem .8rem 4rem}
  .det-head .photo{width:100%;height:200px}
  :root{font-size:14px}
}
@media(max-width:600px){
  html,body{overflow-x:hidden;max-width:100vw}
  .content{padding:.8rem .6rem 4.5rem}
  .pagebar h1{font-size:1.05rem;min-width:0}
  .bell,#menuBtn{width:38px;height:38px;font-size:1rem;flex-shrink:0}
  .stats{grid-template-columns:1fr 1fr;gap:.5rem}
  .stat{padding:.6rem .7rem}
  .stat .n{font-size:1.2rem}
  .grid{grid-template-columns:1fr;gap:.7rem}
  .subtabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:.25rem}
  .subtabs button{white-space:nowrap;flex-shrink:0}
  .panel{padding:.85rem .8rem}
  .det-head{padding:.85rem;gap:.8rem}
  .det-head .qrbox{width:100%}
  .actrow button{flex:1 1 45%}
  .kv{grid-template-columns:1fr 1fr}
  .costrow{grid-template-columns:1fr 1fr}
  .overlay{padding:.6rem .45rem}
  .modal{padding:1rem .85rem;border-radius:14px}
  .fgrid{grid-template-columns:1fr;gap:0}
  .factions{flex-direction:column;align-items:stretch}
  .factions>div{display:flex}
  .factions>div button{flex:1}
  table{font-size:.78rem}
  th,td{padding:.4rem .45rem}
  .ndrawer{width:100vw;max-width:100vw;right:-100vw}
  .login-card{padding:1.7rem 1.3rem;border-radius:18px}
}
@media print{aside.side,.pagebar button,.subtabs,.actrow,.bell,#menuBtn{display:none!important}.panel,.det-head{box-shadow:none;border:1px solid #ccc}body{background:#fff}}
</style>
</head>

<!-- ============ APP ============ -->
<div id="appView">
<div class="shell">

    <div id="deptBox" style="display:none">

    </div>
    <div class="fhead">ตัวกรอง <button onclick="clearFilters()">ล้าง</button></div>
    <div class="filt"><label>ค้นหา</label><input id="fSearch" placeholder="รหัส / ชื่อ / เลขครุภัณฑ์ / GFMIS…" oninput="FIL.search=this.value;renderIfList()"></div>
    <div class="filt"><label>ประเภทครุภัณฑ์</label><select id="fType" onchange="FIL.type=this.value;renderIfList()"><option value="">ทั้งหมด</option></select></div>
    <div class="filt"><label>สถานที่ / ที่ตั้ง</label><select id="fLoc" onchange="FIL.loc=this.value;renderIfList()"><option value="">ทั้งหมด</option></select></div>
    <div class="filt"><label>สถานะครุภัณฑ์</label>
      <div class="chiprow" id="fStat">

  </aside>

  <div class="content">

      <button id="menuBtn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>

  <div style="background:#fff;border-radius:16px;padding:1.3rem 1.8rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 20px 60px rgba(0,0,0,.3)">
    <div style="width:26px;height:26px;border:3.5px solid var(--teal-t);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite"></div>
    <b id="busyMsg" style="font-size:.95rem">กำลังบันทึก…</b>
  </div></div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<div id="pdfReport"></div>
<div id="qrFactory"></div>

<script>
/* ================================================================
   ระบบบริหารครุภัณฑ์สำนักงาน v6 — ต่อยอดจาก Hospital Asset v5
   ตั้งค่า API_URL ให้เป็น Web App URL ของ Apps Script ที่ deploy แล้ว
================================================================ */
const DEFAULT_API_URL='';   // ← ใส่ Web App URL ตรงนี้ได้ หรือกรอกหน้าล็อกอินครั้งแรก
let API_URL=DEFAULT_API_URL;
try{API_URL=localStorage.getItem('ofa_api_url')||DEFAULT_API_URL;}catch(e){}
let CRED=null;
let DB={equipment:[],repairs:[],transfers:[],loans:[],users:[],departments:[],settings:{}};
let USER=null;
let VIEW={page:'list',code:null,subtab:'info'};
let FIL={search:'',type:'',loc:'',stat:new Set(),qr:new Set()};
let CURDEPT='';
let PICK=new Set();            // รายการที่ติ๊กเลือกไว้สำหรับพิมพ์ QR
let PICKMODE=false;

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=n=>(n===''||n==null||isNaN(n))?'-':Number(n).toLocaleString('th-TH');
const fmtB=n=>(n===''||n==null||isNaN(n))?'0':Number(n).toLocaleString('th-TH',{maximumFractionDigits:0});
function fmtD(s){if(!s)return '-';const d=new Date(String(s)+'T00:00');return isNaN(d)?String(s):d.toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'});}
function today(){return new Date().toISOString().slice(0,10);}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function busy(on,msg){const b=$('busy');if(on){$('busyMsg').textContent=msg||'กำลังบันทึก…';b.style.display='flex';}else b.style.display='none';}

/* ---------- API ---------- */
async function api(action,payload={},msg){
  if(!API_URL)throw new Error('ยังไม่ได้ตั้งค่า Web App URL');
  busy(true,msg);
  try{
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action,u:CRED.u,p:CRED.p,...payload})});
    const j=await res.json();
    if(!j.ok)throw new Error(j.error||'เกิดข้อผิดพลาด');
    if(j.db){DB=j.db;ensureDB();}
    if(j.patch)applyPatch(j.patch);
    if(j.eq)applyPatch({sheet:'equipment',key:'code',oldKey:j.eq.code,row:j.eq});
    return j;
  }finally{busy(false);}
}
/* บันทึกแล้วเซิร์ฟเวอร์ส่งกลับเฉพาะแถวที่เปลี่ยน — อัปเดตเฉพาะจุด ไม่โหลดใหม่ทั้งก้อน */
function applyPatch(p){
  if(!p||!p.sheet)return;
  const arr=DB[p.sheet];if(!arr)return;
  const i=arr.findIndex(x=>String(x[p.key])===String(p.oldKey));
  if(p.row===null||p.row===undefined){if(i>=0)arr.splice(i,1);return;}
  if(i>=0)arr[i]=p.row;else arr.push(p.row);
}
function ensureDB(){['equipment','repairs','transfers','loans','users','departments'].forEach(k=>DB[k]=DB[k]||[]);DB.settings=DB.settings||{};}
async function refreshDB(){
  try{await api('getdb',{},'กำลังโหลดข้อมูลล่าสุด…');fillFilterOptions();render();toast('อัปเดตข้อมูลล่าสุดแล้ว');}
  catch(e){toast('โหลดข้อมูลไม่สำเร็จ: '+e.message);}
}

/* ---------- roles ---------- */
const isAdmin=()=>USER&&USER.role==='admin';
const isTech =()=>USER&&(USER.role==='tech'||USER.role==='admin');
const isHead =()=>USER&&(USER.role==='head'||USER.role==='admin');
const ROLE_TH={admin:'ผู้ดูแลระบบ',tech:'ช่างซ่อมบำรุงส่วนกลาง',head:'หัวหน้าหน่วยงาน',staff:'เจ้าหน้าที่หน่วยงาน'};
const deptName=c=>{const d=(DB.departments||[]).find(x=>x.code===c);return d?d.name:(c||'ทุกหน่วยงาน');};
function optsFor(dept,kind){
  const S=DB.settings||{};
  const g=(S['*']&&S['*'][kind])||[];
  let own=[];
  if(dept){own=(S[dept]&&S[dept][kind])||[];}
  else{Object.keys(S).forEach(d=>{if(d!=='*'&&S[d][kind])own=own.concat(S[d][kind]);});}
  return [...new Set([...g,...own])];
}

/* ---------- สถานะ / ยืม ---------- */
const stOf=x=>String(x||'').trim();
const CLOSED=['เสร็จสิ้น','ยกเลิก','จำหน่าย','เตรียมจำหน่าย'];
const LOAN_OPEN='อยู่ระหว่างยืม';
function openLoan(code){return DB.loans.find(l=>stOf(l.code)===stOf(code)&&stOf(l.status)===LOAN_OPEN)||null;}
function daysLeft(d){if(!d)return null;const x=new Date(String(d)+'T00:00');return isNaN(x)?null:Math.ceil((x-new Date(new Date().toDateString()))/864e5);}
function loanInfo(e){
  const l=openLoan(e.code);
  if(!l)return{key:'none',label:'',cls:'b-gray',loan:null,days:null};
  const dl=daysLeft(l.dueDate);
  if(dl===null)return{key:'out',label:'ถูกยืม',cls:'b-blue',loan:l,days:null};
  if(dl<0)return{key:'overdue',label:'เกินกำหนดคืน '+Math.abs(dl)+' วัน',cls:'b-red',loan:l,days:dl};
  if(dl<=3)return{key:'due',label:'ครบกำหนดคืนใน '+dl+' วัน',cls:'b-amber',loan:l,days:dl};
  return{key:'out',label:'ถูกยืม ถึง '+fmtD(l.dueDate),cls:'b-blue',loan:l,days:dl};
}
function eqStatus(e){
  const es=stOf(e.status);
  if(es==='จำหน่าย')return 'จำหน่าย';
  if(es==='เตรียมจำหน่าย')return 'เตรียมจำหน่าย';
  if(openLoan(e.code))return 'ถูกยืม';
  if(DB.repairs.some(r=>stOf(r.code)===stOf(e.code)&&!CLOSED.includes(stOf(r.status))))return 'อยู่ระหว่างซ่อม';
  return es||'ใช้งานปกติ';
}
function stBadge(st){return st.includes('ซ่อม')?'b-amber':st==='ถูกยืม'?'b-blue':st==='จำหน่าย'?'b-red':st==='เตรียมจำหน่าย'?'b-gray':'b-teal';}
function ageText(e){
  if(!e.recvDate)return '-';
  const a=new Date(String(e.recvDate)+'T00:00'),b=new Date();
  if(isNaN(a.getTime()))return '-';
  let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth();
  if(b.getDate()<a.getDate())m--;
  if(m<0){y--;m+=12;}
  return y<0?'-':y+' ปี '+m+' เดือน';
}
function nextClean(e){
  const iv=Number(e.cleanInterval||0);if(!iv)return null;
  const jobs=DB.repairs.filter(r=>stOf(r.code)===stOf(e.code)&&r.kind==='ทำความสะอาด'&&stOf(r.status)==='เสร็จสิ้น'&&r.doneDate)
    .sort((a,b)=>String(b.doneDate).localeCompare(String(a.doneDate)));
  const base=jobs.length?jobs[0].doneDate:(e.recvDate||null);
  if(!base)return null;
  const dt=new Date(String(base)+'T00:00');if(isNaN(dt))return null;
  dt.setMonth(dt.getMonth()+iv);
  return dt.toISOString().slice(0,10);
}
function cleanInfo(e){
  const nc=nextClean(e);if(!nc)return{key:'none',label:'',cls:'b-gray',next:null,days:null};
  const dl=daysLeft(nc);
  if(dl<0)return{key:'over',label:'เกินรอบทำความสะอาด',cls:'b-red',next:nc,days:dl};
  if(dl<=30)return{key:'due',label:'ใกล้ครบรอบทำความสะอาด',cls:'b-amber',next:nc,days:dl};
  return{key:'ok',label:'ทำความสะอาดตามรอบ',cls:'b-teal',next:nc,days:dl};
}
function nextEqCode(){
  let mx=0;
  DB.equipment.forEach(e=>{const m=String(e.code).match(/^OF-(\d+)$/);if(m)mx=Math.max(mx,parseInt(m[1],10));});
  return 'OF-'+String(mx+1).padStart(4,'0');
}
function nextRepairId(){
  const y=new Date().getFullYear()+543;
  let mx=0;DB.repairs.forEach(r=>{const m=String(r.id).match(/(\d+)\s*$/);if(m)mx=Math.max(mx,parseInt(m[1],10));});
  return 'RP-'+y+'-'+String(mx+1).padStart(4,'0');
}
function costSummary(code){
  const reps=DB.repairs.filter(r=>(!code||stOf(r.code)===stOf(code))&&stOf(r.status)!=='ยกเลิก');
  const s={total:0,repair:0,pm:0,clean:0};
  reps.forEach(r=>{
    const c=Number(r.cost||0);if(!c)return;
    s.total+=c;
    if(r.kind==='ซ่อม')s.repair+=c;
    else if(r.kind==='ทำความสะอาด')s.clean+=c;
    else s.pm+=c;
  });
  return s;
}

/* ---------- notifications ---------- */
function buildNotifs(){
  const out=[];
  DB.equipment.forEach(e=>{
    const li=loanInfo(e);
    if(li.key==='overdue')out.push({sev:'crit',code:e.code,t:`เกินกำหนดคืน — ${e.name}`,d:`${li.loan.borrower} · กำหนดคืน ${fmtD(li.loan.dueDate)} (เกิน ${Math.abs(li.days)} วัน)`});
    else if(li.key==='due')out.push({sev:'warn',code:e.code,t:`ใกล้ครบกำหนดคืน — ${e.name}`,d:`${li.loan.borrower} · กำหนดคืน ${fmtD(li.loan.dueDate)}`});
    const cn=cleanInfo(e);
    if(cn.key==='over')out.push({sev:'crit',code:e.code,t:`เกินรอบทำความสะอาด — ${e.name}`,d:`กำหนดเดิม ${fmtD(cn.next)}`});
    else if(cn.key==='due')out.push({sev:'warn',code:e.code,t:`ใกล้ครบรอบทำความสะอาด — ${e.name}`,d:`กำหนด ${fmtD(cn.next)}`});
  });
  DB.repairs.filter(r=>!CLOSED.includes(stOf(r.status))).forEach(r=>{
    out.push({sev:'info',code:r.code,t:`งานค้าง ${r.id} (${r.kind})`,d:`${r.symptom||''} · สถานะ: ${r.status}`});
  });
  return out;
}
function refreshBell(){
  const n=buildNotifs().filter(x=>x.sev!=='info').length;
  $('bellDot').style.display=n?'flex':'none';$('bellDot').textContent=n;
}
function toggleND(){
  const d=$('ndrawer');
  if(!d.classList.contains('open')){
    const items=buildNotifs();
    $('ndList').innerHTML=items.length?items.map(x=>`<div class="nitem ${x.sev}" onclick="toggleND();goDetail('${esc(x.code)}')"><b>${esc(x.t)}</b>${esc(x.d)}</div>`).join(''):'<div class="empty">ไม่มีการแจ้งเตือน 🎉</div>';
  }
  d.classList.toggle('open');
}

/* ---------- auth / nav ---------- */
function resetApiUrl(){
  try{localStorage.removeItem('ofa_api_url');}catch(e){}
  API_URL='';$('apiField').style.display='block';$('apiUrl').value='';toast('วาง Web App URL ใหม่แล้วกดเข้าสู่ระบบ');
}
async function doLogin(){
  const urlIn=$('apiUrl').value.trim();
  if(urlIn){API_URL=urlIn;try{localStorage.setItem('ofa_api_url',API_URL);}catch(e){}}
  if(!API_URL){$('loginErr').textContent='กรุณาใส่ Web App URL ก่อน';$('loginErr').style.display='block';return;}
  const u=$('loginUser').value.trim(),p=$('loginPass').value;
  if(!u||!p){$('loginErr').textContent='กรอกชื่อผู้ใช้และรหัสผ่าน';$('loginErr').style.display='block';return;}
  CRED={u,p};
  let f;
  try{const j=await api('login',{},'กำลังเข้าสู่ระบบ…');f=j.user;}
  catch(err){
    CRED=null;
    $('loginErr').textContent=String(err.message).includes('Failed to fetch')?'เชื่อมต่อไม่ได้ — ตรวจสอบ URL และอินเทอร์เน็ต':err.message;
    $('loginErr').style.display='block';return;
  }
  USER=f;$('loginErr').style.display='none';
  $('loginView').style.display='none';$('appView').style.display='block';
  $('whoName').textContent=f.name;$('whoRole').textContent=ROLE_TH[f.role]||f.role;
  $('footName').textContent=f.name;
  $('footRole').textContent=(f.role==='admin'?'🛡️ ':'')+(ROLE_TH[f.role]||f.role);
  $('avatarCh').textContent=(f.name||'?').trim().charAt(0);
  $('nav-settings').style.display=isHead()?'':'none';
  $('nav-depts').style.display=isAdmin()?'':'none';
  $('nav-users').style.display=isAdmin()?'':'none';
  CURDEPT=isTech()?'':((DB.departments[0]&&DB.departments[0].code)||'');
  fillDeptSelector();fillFilterOptions();refreshBell();
  const m=location.hash.match(/device=([\w\-\.%]+)/);
  const code=m?decodeURIComponent(m[1]):null;
  if(code&&DB.equipment.find(e=>String(e.code)===code))goDetail(code);else goList();
}
function logout(){USER=null;CRED=null;location.hash='';$('appView').style.display='none';$('loginView').style.display='flex';$('loginPass').value='';}
function setNav(id,title){document.querySelectorAll('.side nav button').forEach(b=>b.classList.remove('on'));const n=$(id);if(n)n.classList.add('on');$('pageTitle').textContent=title;$('sidebar').classList.remove('open');}
function goList(){VIEW.page='list';setNav('nav-list','ทะเบียนครุภัณฑ์');render();}
function goAllRepairs(){VIEW.page='repairs';setNav('nav-repairs','งานซ่อม / บำรุงรักษา');render();}
function goLoans(){VIEW.page='loans';setNav('nav-loans','เบิก-ยืม-คืน');render();}
function goQR(){VIEW.page='qr';setNav('nav-qr','พิมพ์ป้าย QR');render();}
function goUsers(){if(!isAdmin()){toast('🔒 เฉพาะผู้ดูแลระบบ');return;}VIEW.page='users';setNav('nav-users','ผู้ใช้งานระบบ');render();}

/* ---------- filters ---------- */
function fillDeptSelector(){
  const ds=DB.departments||[];
  if(ds.length<2&&!isTech()){$('deptBox').style.display='none';return;}
  $('deptBox').style.display='block';
  $('deptSel').innerHTML=(isTech()?`<option value="">🏥 ทุกหน่วยงาน</option>`:'')
    +ds.map(d=>`<option value="${esc(d.code)}" ${CURDEPT===d.code?'selected':''}>${esc(d.name)}</option>`).join('');
}
function fillFilterOptions(){
  $('fType').innerHTML='<option value="">ทั้งหมด</option>'+optsFor(CURDEPT,'types').map(t=>`<option ${FIL.type===t?'selected':''}>${esc(t)}</option>`).join('');
  $('fLoc').innerHTML='<option value="">ทั้งหมด</option>'+optsFor(CURDEPT,'locations').map(t=>`<option ${FIL.loc===t?'selected':''}>${esc(t)}</option>`).join('');
}
function tgS(b){b.classList.toggle('on');const v=b.dataset.v;FIL.stat.has(v)?FIL.stat.delete(v):FIL.stat.add(v);renderIfList();}
function tgQ(b){b.classList.toggle('on');const v=b.dataset.v;FIL.qr.has(v)?FIL.qr.delete(v):FIL.qr.add(v);renderIfList();}
function clearFilters(){
  FIL={search:'',type:'',loc:'',stat:new Set(),qr:new Set()};
  $('fSearch').value='';$('fType').value='';$('fLoc').value='';
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  renderIfList();
}
function applyFilters(list){
  if(CURDEPT)list=list.filter(e=>String(e.dept)===CURDEPT);
  if(FIL.search){const q=FIL.search.toLowerCase();
    list=list.filter(e=>[e.code,e.name,e.assetNo,e.gfmis,e.sn,e.brand,e.model,e.location,e.docNo].join(' ').toLowerCase().includes(q));}
  if(FIL.type)list=list.filter(e=>e.type===FIL.type);
  if(FIL.loc)list=list.filter(e=>e.location===FIL.loc);
  if(FIL.stat.size)list=list.filter(e=>{
    const st=eqStatus(e),li=loanInfo(e);
    return (FIL.stat.has('ok')&&st==='ใช้งานปกติ')
      ||(FIL.stat.has('repair')&&st==='อยู่ระหว่างซ่อม')
      ||(FIL.stat.has('loan')&&st==='ถูกยืม')
      ||(FIL.stat.has('overdue')&&li.key==='overdue')
      ||(FIL.stat.has('dispose')&&(st==='จำหน่าย'||st==='เตรียมจำหน่าย'));
  });
  if(FIL.qr.size)list=list.filter(e=>{
    const has=!!String(e.qrPrinted||'').trim();
    return (FIL.qr.has('yes')&&has)||(FIL.qr.has('no')&&!has);
  });
  return list;
}

function render(){
  const M=$('main');
  const V={list:viewList,detail:viewDetail,repairs:viewRepairs,loans:viewLoans,qr:viewQR,users:viewUsers,settings:viewSettings,depts:viewDepts};
  M.innerHTML=(V[VIEW.page]||viewList)();
  if(VIEW.page==='detail')drawQR();
  refreshBell();
}

function viewList(){
  const total=DB.equipment.length;
  const inRepair=DB.equipment.filter(e=>eqStatus(e)==='อยู่ระหว่างซ่อม').length;
  const onLoan=DB.equipment.filter(e=>eqStatus(e)==='ถูกยืม').length;
  const overdue=DB.equipment.filter(e=>loanInfo(e).key==='overdue').length;
  const noQR=DB.equipment.filter(e=>!String(e.qrPrinted||'').trim()).length;
  const value=DB.equipment.reduce((a,e)=>a+(Number(e.price)||0),0);
  const list=applyFilters([...DB.equipment]);
  const filtering=FIL.search||FIL.type||FIL.loc||FIL.stat.size||FIL.qr.size;
  return `
  <div class="stats">
    <div class="stat"><div class="n">${fmtN(total)}</div><div class="l">ครุภัณฑ์ทั้งหมด</div></div>
    <div class="stat warn"><div class="n">${inRepair}</div><div class="l">อยู่ระหว่างซ่อม</div></div>
    <div class="stat info"><div class="n">${onLoan}</div><div class="l">ถูกยืม/เบิกอยู่</div></div>
    <div class="stat bad"><div class="n">${overdue}</div><div class="l">เกินกำหนดคืน</div></div>
    <div class="stat warn"><div class="n">${fmtN(noQR)}</div><div class="l">ยังไม่ได้พิมพ์ป้าย QR</div></div>
    <div class="stat money"><div class="n">฿${fmtB(value)}</div><div class="l">มูลค่ารวม</div></div>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;margin-bottom:.9rem">
    <div class="mute">แสดง ${list.length} จาก ${total} รายการ ${filtering?'(กรองอยู่ — ล้างได้ที่แถบซ้าย)':''}</div>
    <div style="display:flex;gap:.4rem;flex-wrap:wrap">
      <button class="btn-s btn-sm" onclick="togglePick()">${PICKMODE?'✔ เลือกอยู่ ('+PICK.size+') — กดเพื่อออก':'☑️ เลือกรายการ'}</button>
      ${isHead()?`<button class="btn-p btn-sm" onclick="openEqForm()">＋ เพิ่มครุภัณฑ์</button>`:''}
    </div>
  </div>
  ${(!CURDEPT&&isTech()&&(DB.departments||[]).length>1)?deptBreakdown():''}
  ${list.length?`<div class="grid">${list.map(cardEq).join('')}</div>`:`<div class="empty">ไม่พบครุภัณฑ์ตามเงื่อนไข</div>`}`;
}
function togglePick(){PICKMODE=!PICKMODE;if(!PICKMODE)PICK.clear();render();}
function pickToggle(ev,code){ev.stopPropagation();PICK.has(code)?PICK.delete(code):PICK.add(code);render();}
function deptBreakdown(){
  const rows=(DB.departments||[]).map(d=>{
    const eqs=DB.equipment.filter(e=>String(e.dept)===d.code);
    const open=DB.repairs.filter(r=>String(r.dept)===d.code&&!CLOSED.includes(stOf(r.status))).length;
    const ln=eqs.filter(e=>openLoan(e.code)).length;
    return {d,n:eqs.length,open,ln};
  }).filter(x=>x.n||x.open);
  if(!rows.length)return '';
  return `<div class="panel" style="margin-bottom:1rem">
    <h2 style="margin-bottom:.6rem">🏥 ภาพรวมรายหน่วยงาน</h2>
    <div class="tblwrap"><table><thead><tr><th>หน่วยงาน</th><th>ครุภัณฑ์</th><th>งานค้าง</th><th>ถูกยืม</th><th></th></tr></thead><tbody>
    ${rows.map(x=>`<tr><td><b>${esc(x.d.name)}</b></td><td>${x.n}</td>
      <td>${x.open?`<span class="badge b-amber">${x.open}</span>`:'-'}</td>
      <td>${x.ln?`<span class="badge b-blue">${x.ln}</span>`:'-'}</td>
      <td><button class="btn-s btn-sm" onclick="CURDEPT='${esc(x.d.code)}';fillDeptSelector();fillFilterOptions();render()">ดูเฉพาะหน่วยนี้</button></td></tr>`).join('')}
    </tbody></table></div></div>`;
}
function cardEq(e){
  const st=eqStatus(e),li=loanInfo(e),cn=cleanInfo(e);
  const printed=String(e.qrPrinted||'').trim();
  return `<div class="eq-card" onclick="goDetail('${esc(e.code)}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')goDetail('${esc(e.code)}')">
    ${PICKMODE?`<input type="checkbox" class="pick" ${PICK.has(e.code)?'checked':''} onclick="pickToggle(event,'${esc(e.code)}')">`:''}
    <div class="ph">${e.photo?`<img src="${esc(e.photo)}" alt="" style="object-position:center ${e.photoPos??50}%">`:'🗄️'}
      <span class="st badge ${stBadge(st)}">${esc(st)}</span></div>
    <div class="bd">
      <div class="code">${esc(e.code)}${(!CURDEPT&&isTech())?` · ${esc(deptName(e.dept))}`:''}</div>
      <h3>${esc(e.name)}</h3>
      <div class="meta">${esc(e.assetNo||'-')}</div>
      <div class="meta">📍 ${esc(e.location||'-')}</div>
      <div class="foot">
        <span class="badge b-blue">${esc(e.type||'-')}</span>
        ${li.key!=='none'?`<span class="badge ${li.cls}">${esc(li.label)}</span>`:''}
        ${(cn.key==='due'||cn.key==='over')?`<span class="badge ${cn.cls}">🧹 ${cn.label}</span>`:''}
        <span class="badge ${printed?'b-teal':'b-gray'}">${printed?'🏷️ พิมพ์แล้ว':'🏷️ ยังไม่พิมพ์'}</span>
      </div>
    </div></div>`;
}

/* ---------- DETAIL ---------- */

      <div class="actrow">
        <button class="btn-p btn-sm" onclick="openRepairForm('${esc(e.code)}')">🔧 แจ้งซ่อม</button>

function panelInfo(e){
  const keys=['code','assetNo','gfmis','name','type','brand','model','sn','vendor','docNo','recvDate','price','budget','location','caretaker','cleanInterval','note','qrPrinted','recordedBy'];
  return `<div class="panel"><h2 style="margin-bottom:.75rem">ข้อมูลทั่วไป</h2>
  <div class="kv">${keys.map(k=>{
    let v=e[k];
    if(k==='recvDate'||k==='qrPrinted')v=v?fmtD(v):'-';
    if(k==='price')v=fmtN(v);
    if(k==='cleanInterval')v=Number(v||0)?v+' เดือน':'ไม่กำหนดรอบ';
    return `<div><div class="k">${EQ_LABELS[k]}</div><div class="v">${esc(v??'-')||'-'}</div></div>`;
  }).join('')}
  <div><div class="k">หน่วยงานเจ้าของ</div><div class="v">${esc(deptName(e.dept))}</div></div>
  <div><div class="k">อายุการใช้งาน (นับจากวันรับเข้า)</div><div class="v"><b>${ageText(e)}</b></div></div>
  </div></div>`;
}
function panelRepair(e){
  const reps=DB.repairs.filter(r=>stOf(r.code)===stOf(e.code)).sort((a,b)=>String(b.reqDate||'').localeCompare(String(a.reqDate||'')));
  const cn=cleanInfo(e);
  return `<div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;margin-bottom:.6rem">
      <h2>ประวัติซ่อม / บำรุงรักษา (${reps.length})</h2>

    ${repairTable(reps,true)}</div>`;
}

  const ls=DB.loans.filter(l=>stOf(l.code)===stOf(e.code)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const cur=openLoan(e.code);

    <td><span class="badge ${stOf(l.status)===LOAN_OPEN?(over?'b-red':'b-blue'):'b-teal'}">${esc(l.status)}${over?' (เกิน '+Math.abs(dl)+' วัน)':''}</span></td>

    <td>${stOf(l.status)===LOAN_OPEN?`<button class="btn-s btn-sm" onclick="openReturnForm('${esc(l.id)}')">รับคืน</button>`:''}</td>
  </tr>`;}).join('')}</tbody></table></div>`;
}

  </tr></thead><tbody>

/* วาดป้าย 1 ดวงลง canvas (QR + ข้อความไทย) — ใช้ทั้งโหลดเดี่ยวและ PDF ชุด */
function labelLines(e){
  // บรรทัดที่ 1 = เลขครุภัณฑ์ราชการ (ตัวหนา) · ที่เหลือเรียงตามความสำคัญตอนตามหาของจริง
  const L=[String(e.assetNo||e.code||'').trim(),String(e.name||'').trim()];
  if(e.location)L.push('📍 '+e.location);
  const dn=deptName(e.dept);
  if(dn)L.push(dn);
  if(e.caretaker)L.push('ผู้รับผิดชอบ '+e.caretaker);
  return L.filter(Boolean);
}
function makeQRCanvas(text,px){
  return new Promise(res=>{
    const holder=document.createElement('div');
    $('qrFactory').appendChild(holder);
    try{new QRCode(holder,{text:text,width:px,height:px,correctLevel:QRCode.CorrectLevel.M});}
    catch(e){holder.remove();res(null);return;}
    setTimeout(()=>{
      const c=holder.querySelector('canvas'),i=holder.querySelector('img');
      if(c){const out=document.createElement('canvas');out.width=c.width;out.height=c.height;
            out.getContext('2d').drawImage(c,0,0);holder.remove();res(out);return;}
      if(i){const im=new Image();im.onload=()=>{const out=document.createElement('canvas');
            out.width=im.width;out.height=im.height;out.getContext('2d').drawImage(im,0,0);holder.remove();res(out);};
            im.onerror=()=>{holder.remove();res(null);};im.src=i.src;return;}
      holder.remove();res(null);
    },40);
  });
}
/* ตัดข้อความยาวให้ขึ้นบรรทัดใหม่แทนการตัดทิ้ง (สูงสุด maxRows บรรทัดต่อ 1 ข้อความ) */
function wrapText(ctx,text,maxW,maxRows){
  const words=String(text).split(/(\s+)/);
  const rows=[];let cur='';
  for(const w of words){
    const t=cur+w;
    if(ctx.measureText(t).width<=maxW||!cur.trim()){cur=t;}
    else{rows.push(cur.trim());cur=w.trim();if(rows.length>=maxRows)break;}
  }
  if(cur.trim()&&rows.length<maxRows)rows.push(cur.trim());
  // ถ้ายังยาวเกิน (คำเดียวยาวมาก / ภาษาไทยไม่มีเว้นวรรค) ให้ตัดทีละตัวอักษร
  return rows.map((r,i)=>{
    if(ctx.measureText(r).width<=maxW)return r;
    let s=r;
    while(ctx.measureText(s+'…').width>maxW&&s.length>2)s=s.slice(0,-1);
    return s+'…';
  });
}
async function makeLabelCanvas(e,qrPx){
  qrPx=qrPx||320;
  const qr=await makeQRCanvas(qrURL(e.code),qrPx);
  const src=labelLines(e);
  const pad=Math.round(qrPx*0.07);
  const c=document.createElement('canvas');
  c.width=qrPx+pad*2;
  const maxW=c.width-pad*1.4;
  const measure=document.createElement('canvas').getContext('2d');
  // เตรียมบรรทัดจริง (พร้อมขนาดฟอนต์) ก่อน เพื่อคำนวณความสูงให้พอดี
  const rows=[];
  src.forEach((t,i)=>{
    const size=i===0?Math.round(qrPx*0.085):Math.round(qrPx*0.066);
    const font=(i===0?'700 ':'400 ')+size+"px 'Prompt','Noto Sans Thai','Sukhumvit Set','Leelawadee UI',Tahoma,sans-serif";
    measure.font=font;
    wrapText(measure,t,maxW,i===0?1:2).forEach(line=>rows.push({line,font,lh:Math.round(size*1.35)}));
  });
  const textH=rows.reduce((a,r)=>a+r.lh,0);
  c.height=pad+qrPx+Math.round(pad*0.55)+textH+pad;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);
  if(qr)ctx.drawImage(qr,pad,pad,qrPx,qrPx);
  ctx.fillStyle='#111111';ctx.textAlign='center';ctx.textBaseline='middle';
  let y=pad+qrPx+Math.round(pad*0.55);
  rows.forEach(r=>{ctx.font=r.font;y+=r.lh;ctx.fillText(r.line,c.width/2,y-r.lh/2);});
  return c;
}
async function renderQRPreview(){
  const box=$('qrPrev');if(!box)return;
  const list=qrTargets().slice(0,5);
  if(!list.length)return;
  box.innerHTML='';
  for(const e of list){
    const c=await makeLabelCanvas(e,220);
    const d=document.createElement('div');d.className='lbl';
    d.appendChild(c);
    box.appendChild(d);
  }
}
async function buildQRPdf(markPrinted){
  const all=qrTargets();
  if(!all.length){toast('ไม่มีรายการ');return;}
  const {jsPDF}=window.jspdf;
  const pw=210,ph=297,margin=8;
  const cols=QRCFG.cols,rows=QRCFG.rows,gap=QRCFG.gapmm;
  const cellW=(pw-margin*2-gap*(cols-1))/cols;
  $('qrProgWrap').style.display='block';
  const setProg=(i,n,msg)=>{$('qrProg').style.width=Math.round(i/n*100)+'%';$('qrProgMsg').textContent=msg;};
  const chunks=[];
  for(let i=0;i<all.length;i+=QRCFG.batch)chunks.push(all.slice(i,i+QRCFG.batch));
  let done=0;
  try{
    for(let ci=0;ci<chunks.length;ci++){
      const items=chunks[ci];
      const pdf=new jsPDF('p','mm','a4');
      let col=0,row=0,first=true;
      for(const e of items){
        const c=await makeLabelCanvas(e,320);
        const imgH=cellW*c.height/c.width;
        if(!first&&col===0&&row===0)pdf.addPage();
        const x=margin+col*(cellW+gap);
        const y=margin+row*(imgH+gap);
        if(y+imgH>ph-margin){ // แถวเกินหน้า → ขึ้นหน้าใหม่
          pdf.addPage();col=0;row=0;
          pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',margin,margin,cellW,imgH);
        }else{
          pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',x,y,cellW,imgH);
        }
        first=false;
        col++;
        if(col>=cols){col=0;row++;
          if(margin+row*(imgH+gap)+imgH>ph-margin){pdf.addPage();row=0;}}
        done++;
        if(done%5===0){setProg(done,all.length,`กำลังสร้างป้าย ${done} / ${all.length} …`);await new Promise(r=>setTimeout(r,0));}
      }
      const suffix=chunks.length>1?`_ชุด${ci+1}`:'';
      pdf.save(`QR_ครุภัณฑ์${suffix}_${today()}.pdf`);
    }
    setProg(all.length,all.length,`สร้างเสร็จ ${all.length} ป้าย · ${chunks.length} ไฟล์`);
    if(markPrinted){
      await api('markQrPrinted',{codes:all.map(e=>e.code),date:today()},'กำลังบันทึกสถานะพิมพ์…');
      all.forEach(e=>{const t=DB.equipment.find(x=>x.code===e.code);if(t)t.qrPrinted=today();});
      toast(`บันทึกว่าพิมพ์แล้ว ${all.length} รายการ ✓`);
    }else toast('สร้าง PDF เสร็จแล้ว');
    render();
  }catch(err){
    console.error(err);
    toast('สร้าง PDF ไม่สำเร็จ: '+err.message);
  }
}

function fileToData(file,max=680){
  return new Promise(res=>{
    const rd=new FileReader();
    rd.onload=()=>{const img=new Image();
      img.onload=()=>{const c=document.createElement('canvas');const sc=Math.min(1,max/Math.max(img.width,img.height));
        c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',.72));};
      img.onerror=()=>res(null);img.src=rd.result;};
    rd.onerror=()=>res(null);rd.readAsDataURL(file);
  });
}

async function saveLoan(){

  try{await api('addLoan',{row});}catch(err){toast('บันทึกไม่สำเร็จ: '+err.message);return;}
  closeModal();toast('บันทึกการยืมแล้ว ✓');render();

/* ================================================================
   สแกน QR ในแอป
================================================================ */
let SCAN=null,SCANMODE='open',SCANNED=[],LASTHIT={c:'',t:0};
function parseScan(txt){
  const t=String(txt||'').trim();
  const m=t.match(/device=([^&\s]+)/);
  if(m){try{return decodeURIComponent(m[1]);}catch(e){return m[1];}}
  return t;
}
function openScan(mode){
  SCANMODE=mode||'open';
  if(SCANMODE==='open')SCANNED=[];
  openModal(`<h2>📷 สแกน QR<button class="x" onclick="closeModal()">✕</button></h2>
  <div class="scanmode">
    <button id="sm_open" class="${SCANMODE==='open'?'on':''}" onclick="switchScan('open')">🔍 เปิดบัตรครุภัณฑ์</button>
    <button id="sm_multi" class="${SCANMODE==='multi'?'on':''}" onclick="switchScan('multi')">📋 สแกนต่อเนื่อง (ตรวจนับ)</button>
  </div>
  <div id="qrReader"></div>
  <div class="mute" id="scanHint" style="text-align:center;margin-top:.5rem"></div>
  <div id="scanList" style="margin-top:.8rem"></div>
  <div class="factions"><span class="mute" id="scanCount"></span>
    <div style="display:flex;gap:.5rem">
      <button class="btn-s" id="scanPickBtn" style="display:none" onclick="pickScanned()">☑️ ใส่ในรายการเลือก</button>
      <button class="btn-s" onclick="closeModal()">ปิด</button></div></div>`);
  drawScanUI();startScan();
}
function switchScan(m){SCANMODE=m;$('sm_open').classList.toggle('on',m==='open');$('sm_multi').classList.toggle('on',m==='multi');drawScanUI();}
function drawScanUI(){
  const h=$('scanHint');
  if(h)h.textContent=SCANMODE==='open'?'ส่อง QR บนตัวครุภัณฑ์ → เปิดบัตรทันที':'ส่องต่อเนื่องได้เลย รายการจะสะสมด้านล่าง';
  const L=$('scanList');if(!L)return;
  L.innerHTML=SCANNED.map(x=>`<div class="scanhit">
      ${x.photo?`<img src="${esc(x.photo)}" alt="">`:'<div style="width:42px;height:42px;border-radius:8px;background:var(--gray-t);display:flex;align-items:center;justify-content:center">🗄️</div>'}
      <div class="t"><b>${esc(x.name)}</b><span class="mute">${esc(x.code)} · 📍 ${esc(x.location||'-')}</span></div>
      <button class="btn-s btn-sm" onclick="closeModal();goDetail('${esc(x.code)}')">เปิด</button>
    </div>`).join('');
  const c=$('scanCount');if(c)c.textContent=SCANNED.length?`สแกนแล้ว ${SCANNED.length} รายการ`:'';
  const b=$('scanPickBtn');if(b)b.style.display=(SCANMODE==='multi'&&SCANNED.length)?'':'none';
}
function pickScanned(){
  PICKMODE=true;SCANNED.forEach(x=>PICK.add(x.code));
  closeModal();toast('ใส่ในรายการเลือกแล้ว '+PICK.size+' รายการ');render();
}
async function startScan(){
  if(typeof Html5Qrcode==='undefined'){$('qrReader').innerHTML='<div class="empty" style="color:#fff">โหลดตัวอ่าน QR ไม่ได้ — ตรวจสอบอินเทอร์เน็ต</div>';return;}
  try{
    SCAN=new Html5Qrcode('qrReader');
    await SCAN.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},onScanHit,()=>{});
  }catch(err){
    $('qrReader').innerHTML=`<div class="empty" style="color:#fff;font-size:.85rem">เปิดกล้องไม่ได้<br>${esc(String(err).slice(0,120))}<br><br>ตรวจว่าอนุญาตให้เว็บใช้กล้องแล้ว</div>`;
  }
}
function stopScan(){
  if(!SCAN)return;
  try{SCAN.stop().then(()=>{try{SCAN.clear();}catch(e){}SCAN=null;}).catch(()=>{SCAN=null;});}catch(e){SCAN=null;}
}
function onScanHit(txt){
  const code=parseScan(txt),now=Date.now();
  if(code===LASTHIT.c&&now-LASTHIT.t<2500)return;
  LASTHIT={c:code,t:now};
  const e=DB.equipment.find(x=>String(x.code)===code);
  if(!e){toast('⚠ ไม่พบครุภัณฑ์ '+code);return;}
  try{navigator.vibrate&&navigator.vibrate(60);}catch(_){}
  if(SCANMODE==='open'){stopScan();closeModal();goDetail(e.code);toast('เปิด '+e.code);return;}
  if(SCANNED.some(x=>x.code===e.code)){toast('สแกนรายการนี้ไปแล้ว');return;}
  SCANNED.unshift({code:e.code,name:e.name,location:e.location,photo:e.photo});
  drawScanUI();toast('✓ '+e.name);
}

function imgToData(url,maxW=220){
  return new Promise(res=>{
    if(!url){res('');return;}
    if(String(url).indexOf('data:')===0){res(url);return;}
    const im=new Image();im.crossOrigin='anonymous';
    const t=setTimeout(()=>res(''),9000);
    im.onload=()=>{clearTimeout(t);try{
      const c=document.createElement('canvas');const sc=Math.min(1,maxW/im.width);
      c.width=Math.max(1,im.width*sc);c.height=Math.max(1,im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',.8));}catch(e){res('');}};
    im.onerror=()=>{clearTimeout(t);res('');};
    im.src=url;
  });
}
async function exportPDFOne(code){
  const e=DB.equipment.find(x=>String(x.code)===String(code));
  const s=costSummary(code);
  const reps=DB.repairs.filter(r=>stOf(r.code)===stOf(code)).sort((a,b)=>String(b.reqDate||'').localeCompare(String(a.reqDate||'')));
  const lns=DB.loans.filter(l=>stOf(l.code)===stOf(code));
  const mv=DB.transfers.filter(t=>stOf(t.code)===stOf(code));
  busy(true,'กำลังเตรียมรูปภาพประกอบ PDF…');
  const imgMap={};
  for(const r of reps){
    imgMap[r.id+'_b']=[];imgMap[r.id+'_a']=[];
    for(const u of imgList(r.imgBefore)){const d=await imgToData(u);if(d)imgMap[r.id+'_b'].push(d);}
    for(const u of imgList(r.imgAfter)){const d=await imgToData(u);if(d)imgMap[r.id+'_a'].push(d);}
  }
  busy(false);
  const kv=Object.keys(EQ_LABELS).map(k=>`<tr><th style="width:190px">${EQ_LABELS[k]}</th><td>${esc(e[k]??'-')||'-'}</td></tr>`).join('');
  $('pdfReport').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div style="flex:1"><h1>รายงานครุภัณฑ์สำนักงาน</h1>
      <div style="color:#555">${esc(e.code)} — ${esc(e.name)} · ${esc(deptName(e.dept))} · พิมพ์เมื่อ ${new Date().toLocaleDateString('th-TH',{dateStyle:'long'})}</div></div>
      ${e.photo?`<img src="${esc(e.photo)}" style="width:95px;height:95px;object-fit:cover;border-radius:8px;border:1px solid #ccc">`:''}
    </div>
    <h2>1. ข้อมูลทั่วไป</h2><table>${kv}<tr><th>หน่วยงานเจ้าของ</th><td>${esc(deptName(e.dept))}</td></tr><tr><th>อายุการใช้งาน</th><td>${ageText(e)}</td></tr><tr><th>สถานะ</th><td>${eqStatus(e)}</td></tr></table>
    <h2>2. สรุปค่าใช้จ่าย (บาท)</h2>
    <table><tr><th>รวม</th><th>ซ่อม</th><th>บำรุงรักษา</th><th>ทำความสะอาด</th><th>ราคาจัดซื้อ</th></tr>
    <tr><td><b>${fmtB(s.total)}</b></td><td>${fmtB(s.repair)}</td><td>${fmtB(s.pm)}</td><td>${fmtB(s.clean)}</td><td>${fmtB(e.price)}</td></tr></table>
    <h2>3. ประวัติซ่อม / บำรุงรักษา (${reps.length})</h2>
    <table><tr><th>เลขที่</th><th>งาน</th><th>วันแจ้ง</th><th>ผู้แจ้ง</th><th>รายละเอียด</th><th>สาเหตุ</th><th>วิธีแก้ไข</th><th>ผู้รับจ้าง</th><th>ค่าใช้จ่าย</th><th>เสร็จ</th><th>สถานะ</th><th>ก่อน</th><th>หลัง</th></tr>
    ${reps.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.kind)}</td><td>${fmtD(r.reqDate)}</td><td>${esc(r.reporter)}</td><td>${esc(r.symptom)}</td><td>${esc(r.cause)||'-'}</td><td>${esc(r.fix)||'-'}</td><td>${esc(r.company)||'-'}</td><td>${fmtN(r.cost)}</td><td>${fmtD(r.doneDate)}</td><td>${esc(r.status)}</td><td>${(imgMap[r.id+'_b']||[]).map(d=>`<img src="${d}" style="width:78px;border-radius:4px;margin:1px">`).join('')||'-'}</td><td>${(imgMap[r.id+'_a']||[]).map(d=>`<img src="${d}" style="width:78px;border-radius:4px;margin:1px">`).join('')||'-'}</td></tr>`).join('')||'<tr><td colspan="13">ไม่มีข้อมูล</td></tr>'}</table>
    <h2>4. ประวัติเบิก-ยืม-คืน (${lns.length})</h2>
    <table><tr><th>เลขที่</th><th>ประเภท</th><th>ผู้เบิก/ยืม</th><th>หน่วยงาน</th><th>วันที่</th><th>กำหนดคืน</th><th>คืนจริง</th><th>สถานะ</th></tr>
    ${lns.map(l=>`<tr><td>${esc(l.id)}</td><td>${esc(l.type)}</td><td>${esc(l.borrower)}</td><td>${esc(l.borrowDept)||'-'}</td><td>${fmtD(l.date)}</td><td>${l.dueDate?fmtD(l.dueDate):'-'}</td><td>${l.returnDate?fmtD(l.returnDate):'-'}</td><td>${esc(l.status)}</td></tr>`).join('')||'<tr><td colspan="8">ไม่มีข้อมูล</td></tr>'}</table>
    <h2>5. ประวัติการย้ายจุด</h2>
    <table><tr><th>วันที่</th><th>จากหน่วยงาน</th><th>จากจุด</th><th>ไปหน่วยงาน</th><th>ไปจุด</th><th>ผู้บันทึก</th></tr>
    ${mv.map(t=>`<tr><td>${fmtD(t.date)}</td><td>${esc(deptName(t.fromDept))}</td><td>${esc(t.from)||'-'}</td><td>${esc(deptName(t.toDept))}</td><td>${esc(t.to)}</td><td>${esc(t.by)}</td></tr>`).join('')||'<tr><td colspan="6">ไม่มีข้อมูล</td></tr>'}</table>`;
  toast('กำลังสร้าง PDF…');
  try{
    const canvas=await html2canvas($('pdfReport'),{scale:2,backgroundColor:'#fff',useCORS:true});
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF('p','mm','a4');
    const pw=210,ph=297,margin=8,iw=pw-margin*2;
    const ihTotal=canvas.height*iw/canvas.width,pageH=ph-margin*2;
    let rendered=0,page=0;
    while(rendered<ihTotal){
      if(page>0)pdf.addPage();
      const sliceHpx=Math.min(canvas.height-rendered*canvas.width/iw,pageH*canvas.width/iw);
      const c2=document.createElement('canvas');
      c2.width=canvas.width;c2.height=sliceHpx;
      c2.getContext('2d').drawImage(canvas,0,rendered*canvas.width/iw,canvas.width,sliceHpx,0,0,canvas.width,sliceHpx);
      pdf.addImage(c2.toDataURL('image/jpeg',.92),'JPEG',margin,margin,iw,sliceHpx*iw/canvas.width);
      rendered+=pageH;page++;
      if(page>25)break;
    }
    pdf.save(`${code}_report.pdf`);
    toast('บันทึก PDF แล้ว');
  }catch(err){console.error(err);toast('สร้าง PDF ไม่สำเร็จ');}
  $('pdfReport').innerHTML='';
}
